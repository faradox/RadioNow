x-all: &all
  ENVIRONMENT: ${RADIONOW_ENVIRONMENT:-production}
  LOG_LEVEL: ${RADIONOW_LOG_LEVEL:-INFO}
  GEMINI_API_KEY: ${RADIONOW_GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${RADIONOW_ANTHROPIC_API_KEY:-}
  DEFAULT_LLM: ${RADIONOW_DEFAULT_LLM:-gemini}
  GEMINI_MODEL: ${RADIONOW_GEMINI_MODEL:-gemini-4-argon}
  CLAUDE_MODEL: ${RADIONOW_CLAUDE_MODEL:-claude-opus-5-5}
  MINIMAX_TTS_MODEL: ${RADIONOW_MINIMAX_TTS_MODEL:-minimax/speech-2.8-hd}
  MINIMAX_CLONE_TARGET: ${RADIONOW_MINIMAX_CLONE_TARGET:-speech-2.6-hd}
  DAILY_ENABLED: ${RADIONOW_DAILY_ENABLED:-true}
  DAILY_TIME: ${RADIONOW_DAILY_TIME:-06:00}
  NEWS_FEEDS: ${RADIONOW_NEWS_FEEDS:-}
  NEWS_CONTACT_URL: ${RADIONOW_NEWS_CONTACT_URL:-https://github.com/faradox/RadioNow}
  REPLICATE_PRICES: ${RADIONOW_REPLICATE_PRICES:-}
  TZ: Europe/Berlin
  REPLICATE_API_TOKEN: ${RADIONOW_REPLICATE_API_TOKEN:?}
  MONGO_URL: ${RADIONOW_MONGO_URL:-mongodb://${RADIONOW_MONGO_INITDB_ROOT_USERNAME:-admin}:${RADIONOW_MONGO_INITDB_ROOT_PASSWORD:-admin}@radionow-mongodb:27017/}

services:
  radionow:
    build:
      context: ./
      args:
        USER_ID: ${uid:-1000}
        GROUP_ID: ${gid:-1000}
    image: radionow:latest
    container_name: radionow
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RADIONOW_PORT:-8090}:8090"
    volumes:
      - ./audio:/app/audio
      - ./voices:/app/voices
      - ./jingles:/app/jingles:ro
    environment:
      <<: [*all]
      PORT: 8090
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3

  radionow-mongodb:
    image: mongo:7
    container_name: radionow-mongodb
    restart: unless-stopped
    profiles: ["localdb"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RADIONOW_MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${RADIONOW_MONGO_INITDB_ROOT_PASSWORD:-admin}
    volumes:
      - radionow_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" mongodb://${RADIONOW_MONGO_INITDB_ROOT_USERNAME:-admin}:${RADIONOW_MONGO_INITDB_ROOT_PASSWORD:-admin}@localhost:27017/admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  radionow_mongodb_data:
