<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Radio Now</title>
    <meta name="description" content="Radio Now: morning broadcasts and musings from AI-voiced philosophers, poets and comedians.">
    <meta name="theme-color" content="#1d2433">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/landing.css">
    <script>
        // Sky follows the visitor's clock; set before first paint.
        (function () {
            const h = new Date().getHours();
            const t = h >= 5 && h < 10 ? 'dawn' : h >= 10 && h < 17 ? 'day' : h >= 17 && h < 21 ? 'dusk' : 'night';
            document.documentElement.dataset.time = t;
        })();
    </script>
</head>
<body>
    {% include "_scene.svg" %}
    <div class="vignette"></div>

    <header class="top">
        <h1 class="wordmark">Radio Now</h1>
        <nav class="top-actions">
            <button class="icon-btn" id="btn-script" aria-label="Read the script" title="Script">
                <svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z M9 10h6 M9 13h6 M9 16h4"/></svg>
            </button>
            <button class="icon-btn" id="btn-list" aria-label="All episodes" title="All episodes">
                <svg viewBox="0 0 24 24"><path d="M5 7h14 M5 12h14 M5 17h9"/></svg>
            </button>
        </nav>
    </header>

    <main class="player" {% if not episodes %}hidden{% endif %}>
        <p class="ep-kicker" id="ep-kicker"></p>
        <h2 class="ep-title" id="ep-title"></h2>
        <p class="ep-meta" id="ep-meta"></p>

        <div class="progress" id="progress" role="slider" aria-label="Seek" tabindex="0"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>

        <div class="controls">
            <button class="icon-btn" id="btn-prev" aria-label="Newer episode" title="Newer">
                <svg viewBox="0 0 24 24"><path d="M7 6v12 M18 6l-8 6 8 6z"/></svg>
            </button>
            <button class="play-btn" id="btn-play" aria-label="Play">
                <svg class="i-play" viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5z"/></svg>
                <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 6v12 M15 6v12"/></svg>
            </button>
            <button class="icon-btn" id="btn-next" aria-label="Older episode" title="Older">
                <svg viewBox="0 0 24 24"><path d="M17 6v12 M6 6l8 6-8 6z"/></svg>
            </button>
        </div>
    </main>

    {% if not episodes %}
    <main class="player empty"><h2 class="ep-title">The station is still quiet.</h2><p class="ep-meta">Check back at sunrise.</p></main>
    {% endif %}

    <aside class="panel" id="panel-list" aria-hidden="true">
        <div class="panel-head">
            <h3>Episodes</h3>
            <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
        </div>
        <ol class="ep-list" id="ep-list"></ol>
    </aside>

    <aside class="panel" id="panel-script" aria-hidden="true">
        <div class="panel-head">
            <h3 id="script-title">Script</h3>
            <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
        </div>
        <div class="script-body" id="script-body"></div>
    </aside>

    <footer class="note">All voices are AI recreations. Satire, not news.</footer>

    <audio id="audio" preload="metadata"></audio>
    <script id="episodes-data" type="application/json">{{ episodes | tojson }}</script>
    <script src="/static/landing.js" defer></script>
</body>
</html>
